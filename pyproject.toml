[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "honeywatch"
version = "1.0.0"
description = "Non-executing SSH and HTTP honeypot with YAML rule detection, scoring and a Textual dashboard."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "HoneyWatch" }]
keywords = ["honeypot", "security", "ssh", "detection", "mitre-attack"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Framework :: AsyncIO",
  "Topic :: Security",
]
dependencies = [
  "asyncssh>=2.14,<3",
  "aiohttp>=3.9,<4",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "geoip2>=4.7,<6",
  "textual>=0.60,<2",
  "rich>=13.7,<15",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
honeywatch = "honeywatch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/honeywatch"]

[tool.hatch.build.targets.sdist]
include = ["src", "rules", "config", "tests", "deploy", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "integration: live local service tests",
  "slow: longer running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]